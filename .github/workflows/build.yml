name: Deploy release for BM fonts

on: [push]

jobs:
  build-and-push-image:
      # Deploy only from the default branch
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
        attestations: write
        id-token: write      
      steps:
        - name: Checkout the repository
          uses: actions/checkout@v7
        - name: Build the xar package
          uses: CedX/SetupAnt@v2026
        - name: Create the release
          uses: iamkubi/github-release@2.0
          with:
            token: ${{ secrets.DEPLOY_PAT }}
            tag: "0.0.1"
            files: ./build/bm-fonts.xar
            gzip: false
            allow_override: true
  